<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #5865F2; /* Discord Blurple */
            background-image: url('https://assets-global.website-files.com/6257adef93867e56f84d3092/63600e80220b8f8e57d7069e_Discord%20Background.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #313338; /* Dark Gray Modal Background */
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.24);
            width: 320px;
            text-align: center;
            color: #dbdee1;
        }

        h2 {
            color: #f2f3f5;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: #b5bbd0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        label {
            color: #b5bbd0;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            display: block;
            text-align: left;
            margin-bottom: 8px;
        }

        input {
            background-color: #1e1f22;
            border: none;
            border-radius: 3px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            color: #dbdee1;
            font-size: 16px;
            margin-bottom: 16px;
        }

        input:focus {
            outline: 2px solid #00affa;
        }

        button {
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4752c4;
        }

        .footer {
            margin-top: 16px;
            font-size: 14px;
            color: #b5bbd0;
        }
        
        .footer a {
            color: #00affa;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Welcome back!</h2>
        <p>We're so excited to see you again!</p>

        <label>EMAIL OR PHONE NUMBER</label>
        <input type="text" id="email" placeholder="Email or Phone Number">

        <label>PASSWORD</label>
        <input type="password" id="password" placeholder="Password">

        <button id="loginBtn">LOG IN</button>

        <div class="footer">
            <p><a href="#">Forgot your password?</a></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginBtn = document.getElementById('loginBtn');
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');

            loginBtn.addEventListener('click', () => {
                // This runs when you click the button
                console.log("Login clicked for: " + emailInput.value);
                
                // Visual feedback so you know it worked
                loginBtn.textContent = "Logging in...";
                loginBtn.style.backgroundColor = "#23a559"; // Discord Green
                
                // Alert to prove it captured the data
                setTimeout(() => {
                    alert(`Logged in as: ${emailInput.value}`);
                    loginBtn.textContent = "LOG IN";
                    loginBtn.style.backgroundColor = "#5865F2";
                }, 500);
            });
        });
    </script>

</body>
</html>
